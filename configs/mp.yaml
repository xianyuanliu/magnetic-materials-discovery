dataset: MP
dataset_path: data/mp-magnetism.csv

pt_path: data/Periodic-table/periodic_table.xlsx
mm_path: data/Miedema-model/Miedema-model-reduced.xlsx

models:
  - linear
  - ridge
  - lasso
  - elasticnet
  - rf
  - xgb
  - svr
  - mlp

enable_data_visualization: true
enable_hyperparameter_tuning: true
enable_ablation_study: true

# evaluation_mode: holdout # or cross_validation or ood
evaluation_mode: cross_validation
# train_dataset_path: data/mp-train.csv
# test_dataset_path: data/mp-test.csv

cv_folds: 10
cv_shuffle: true
cv_random_state: 0
cv_seeds: [0, 5]

# Holdout mode: repeat the split over these seeds and report mean ± std.
# Seeds the split only — random_state below seeds the models.
holdout_seeds: [0, 1, 2, 3, 4]
holdout_train_size: 0.8

# Hyperparameter-search budget; see configs/novamag.yaml for the cost formula.
tune_cv_folds: 3
tune_n_iter: 20

random_state: 0

# The nine engineered features, named explicitly. Without this the loader falls
# back to "every column that is not the target or the formula", which promotes
# any stray id or metadata column in the CSV into a model input.
feature_columns:
  - compoundradix
  - stoicentw
  - Zw
  - periodw
  - groupw
  - meltingTw
  - miedemaH
  - valencew
  - electronegw

# Which two models the paired comparison reports on. Previously hard-coded to
# Random Forest vs XGBoost inside the evaluation code.
compare_models: [rf, xgb]

# Which model the importance and SHAP figures explain, and which models the
# case studies compare. Both used to be hard-coded.
interpret_model: rf
case_study_models: [rf, xgb, ridge]
