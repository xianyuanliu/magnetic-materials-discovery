dataset: MP
dataset_path: data/mp-magnetism.csv

pt_path: data/Periodic-table/periodic_table.xlsx
mm_path: data/Miedema-model/Miedema-model-reduced.xlsx

models:
  - linear
  - ridge
  - lasso
  - elasticnet
  - rf
  - xgb
  - svr
  - mlp

enable_data_visualization: true
enable_hyperparameter_tuning: true
enable_interpretation: true

evaluation_mode: cross_validation

cv_folds: 10
cv_shuffle: true
cv_random_state: 0
cv_seeds: [0, 5]

tune_cv_folds: 3
tune_n_iter: 20

random_state: 0

feature_columns:
  - compoundradix
  - stoicentw
  - atomicweightw
  - periodw
  - groupw
  - meltingTw
  - miedemaH
  - valencew
  - electronegw

compare_models: [rf, xgb]

explain_models: [rf]
case_study_models: [rf, xgb, ridge]
