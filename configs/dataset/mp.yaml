  seeds: [0, 5]

ood:
  output_dir: ./results/mp_ood
uncertainty:
  output_dir: ./results/mp_uncertainty
predict:
  model_path: ./models/mp_rf.joblib
  output_path: ./results/mp_predictions.csv
