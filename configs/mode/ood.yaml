# @package _global_
# Out-of-distribution evaluation configuration
# This mode aims to evaluate model performance on out-of-distribution data, using various hold-out strategies.

evaluation_mode: ood

models: [ridge, rf, xgb, svr, mlp]

kfold:
  folds: 10
ood:
  scenarios: [element, period, group, cluster, sparsex, sparsey]
  seeds: [0, 1]
