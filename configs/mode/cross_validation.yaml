# @package _global_
# Cross-validation configuration
# This mode aims to evaluate model performance using K-fold cross-validation.

evaluation_mode: cross_validation

models: [linear, ridge, lasso, elasticnet, rf, xgb, svr, mlp]

kfold:
  folds: 10
  seeds: [0, 5, 10, 15, 20]
tuning:
  enabled: true

enable_data_visualization: true
