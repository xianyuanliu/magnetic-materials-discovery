dataset: Novamag
dataset_path: data/novamag-magnetism.csv
pt_path: data/Periodic-table/periodic_table.xlsx
mm_path: data/Miedema-model/Miedema-model-reduced.xlsx
evaluation_mode: random_split

models:
  - rf
  - xgb
  - ridge

enable_data_visualization: false
enable_hyperparameter_tuning: false
enable_interpretation: true

cv_folds: 5
cv_shuffle: true
cv_random_state: 0

feature_columns:
  - compoundradix
  - stoicentw
  - atomicweightw
  - periodw
  - groupw
  - meltingTw
  - miedemaH
  - valencew
  - electronegw

explain_models: [rf]
case_study_models: [rf, xgb, ridge]
