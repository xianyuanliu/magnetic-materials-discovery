dataset: mp
evaluation_mode: ood

pt_path: data/Periodic-table/periodic_table.xlsx
mm_path: data/Miedema-model/Miedema-model-reduced.xlsx

# OOD splits are carved out of the whole pool, so both paths point at one file.
train_dataset_path: data/mp-magnetism.csv
test_dataset_path: data/mp-magnetism.csv

# Kept identical to configs/novamag_ood.yaml — see the note there.
models:
  - ridge
  - rf
  - xgb
  - svr
  - mlp

enable_data_visualization: false
enable_hyperparameter_tuning: false
enable_ablation_study: false

cv_folds: 10
cv_shuffle: true
cv_random_state: 0
cv_seeds: [0, 1]

tune_cv_folds: 3
tune_n_iter: 20

random_state: 0

target_column: saturation magnetization
formula_column: chemical formula

ood_mode: all
ood_k: 10
ood_seed: 0
ood_fractions: [0.1, 0.2]
sparsex_neighbors: 5
sparsey_center: median

ood_max_splits: null
ood_min_test: 10
ood_min_train: 50

ood_size_matched_control: true

ood_output_dir: ./results/mp_ood

# The nine engineered features, named explicitly. Without this the loader falls
# back to "every column that is not the target or the formula", which promotes
# any stray id or metadata column in the CSV into a model input.
feature_columns:
  - compoundradix
  - stoicentw
  - Zw
  - periodw
  - groupw
  - meltingTw
  - miedemaH
  - valencew
  - electronegw

# Which two models the paired comparison reports on. Previously hard-coded to
# Random Forest vs XGBoost inside the evaluation code.
compare_models: [rf, xgb]
