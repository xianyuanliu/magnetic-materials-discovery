# Base configuration. This file sets up the default parameters and paths for the dataset, model configurations, and feature columns. 

defaults:
  - schema
  - _self_
  - dataset: novamag
  - mode: cross_validation

pt_path: data/Periodic-table/periodic_table.xlsx
mm_path: data/Miedema-model/Miedema-model-reduced.xlsx
target_column: saturation magnetization
formula_column: chemical formula
model_random_state: 0
compare_models: [rf, xgb]

output_dir: results/${dataset}_${evaluation_mode}
predict:
  model_path: models/${dataset}.joblib

feature_columns:
  - compoundradix
  - stoicentw
  - atomicweightw
  - periodw
  - groupw
  - meltingTw
  - miedemaH
  - valencew
  - electronegw
