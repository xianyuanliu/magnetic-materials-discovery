# Lint configuration. The project follows the Google Python Style Guide, with a
# 150-character line limit rather than the guide's 80 — the engineered-feature
# and model-registry call sites read better unwrapped than split across lines.
[flake8]
max-line-length = 150
extend-ignore =
    # E203 disagrees with black on slice spacing.
    E203
exclude =
    .git,
    __pycache__,
    .idea,
    .vscode

[pycodestyle]
max-line-length = 150
