# Lint configuration. The project follows the Google Python Style Guide, with a
# 120-character line limit rather than the guide's 80 — wide enough that the
# feature-engineering and model call sites read unwrapped, tight enough to stay
# a real guardrail (99% of lines are already under 100).
[flake8]
max-line-length = 120
extend-ignore =
    # E203 disagrees with black on slice spacing.
    E203
exclude =
    .git,
    __pycache__,
    .idea,
    .vscode

[pycodestyle]
max-line-length = 120
